<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Backup-Status</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html { background: #12151a; }
  body {
    margin: 0; padding: 22px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #12151a; color: #e6e6e6;
  }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  h1 { font-size: 19px; margin: 0; font-weight: 600; }
  .muted { color: #8b95a5; font-size: 12.5px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card { background: #1a1f27; border: 1px solid #262d38; border-radius: 10px; padding: 16px; }
  .card h2 {
    font-size: 12.5px; margin: 0 0 10px; color: #a9b4c4;
    font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .ok { background: #12351f; color: #4ade80; border: 1px solid #1e5c33; }
  .bad { background: #3a1414; color: #f87171; border: 1px solid #6b2020; }
  .warn { background: #3a2f10; color: #fbbf24; border: 1px solid #6b561a; }
  .run { background: #14243a; color: #60a5fa; border: 1px solid #1e3a5c; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  td { padding: 3px 0; vertical-align: top; font-size: 13.5px; }
  td:first-child { color: #8b95a5; width: 132px; }
  pre {
    background: #0e1116; border: 1px solid #232a34; border-radius: 6px;
    padding: 8px; font-size: 11.5px; overflow: auto; max-height: 84px;
    white-space: pre-wrap; color: #9aa6b6; margin: 10px 0 0;
  }
  .bar { height: 8px; background: #232a34; border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #2f6fd0, #4ade80); }
  .alarm { background: #3a1414; border: 1px solid #7f2020; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .alarm strong { color: #fca5a5; display: block; margin-bottom: 6px; }
  .alarm pre { background: #2a0f0f; border-color: #7f2020; color: #fecaca; margin: 0; max-height: none; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  button {
    background: #202836; color: #dbe2ee; border: 1px solid #303a4a;
    border-radius: 7px; padding: 7px 13px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #27303f; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Backup-Status</h1>
  <span class="muted" id="stamp">lädt …</span>
</header>

<div id="alarm"></div>
<div class="grid" id="cards"></div>

<div class="actions">
  <button id="b-restic">Backup jetzt starten</button>
  <button id="b-sync">Sync jetzt starten</button>
  <button id="b-watch">Jetzt prüfen</button>
  <button id="b-reload">Neu laden</button>
</div>

<script>
const inv = (cmd, args) => window.__TAURI__.core.invoke(cmd, args || {});
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function badge(u) {
  if (['active','activating','reloading'].includes(u.state)) return '<span class="badge run">LÄUFT GERADE</span>';
  if (u.result === 'success') return '<span class="badge ok">ALLES OK</span>';
  if (['failed','exit-code','timeout','signal'].includes(u.result)) return '<span class="badge bad">FEHLGESCHLAGEN</span>';
  return '<span class="badge warn">NOCH NIE GELAUFEN</span>';
}

function card(title, u, extra) {
  const rows = [];
  if (u.last) rows.push(`<tr><td>Letzter Lauf</td><td>${esc(u.last)}</td></tr>`);
  if (u.next) rows.push(`<tr><td>Nächster Lauf</td><td>${esc(u.next)}</td></tr>`);
  return `<div class="card"><h2>${esc(title)}</h2>${badge(u)}
    <table>${rows.join('')}${extra || ''}</table>
    ${u.tail ? `<pre>${esc(u.tail)}</pre>` : ''}</div>`;
}

function render(s) {
  document.getElementById('stamp').textContent = 'Stand ' + s.now;
  document.getElementById('alarm').innerHTML = s.alarm
    ? `<div class="alarm"><strong>Aktueller Alarm</strong><pre>${esc(s.alarm)}</pre></div>`
    : '';

  const loading = s.partial ? 'wird geladen …' : '–';
  const resticExtra = `
    <tr><td>Letzter Snapshot</td><td>${esc(s.restic.snapshot || loading)} ${esc(s.restic.snapshot_id || '')}</td></tr>
    <tr><td>Gesichert</td><td>${esc(s.restic.snapshot_size || loading)}</td></tr>`;

  const syncExtra = s.sync.tail && s.sync.tail.includes('Transferred')
    ? '' : '';

  let cloud = '<div class="card"><h2>pCloud</h2>';
  if (s.cloud.total) {
    cloud += `<table>
      <tr><td>Belegt</td><td>${esc(s.cloud.used)} von ${esc(s.cloud.total)}</td></tr>
      <tr><td>Frei</td><td>${esc(s.cloud.free)}</td></tr></table>
      <div class="bar"><div style="width:${s.cloud.percent.toFixed(1)}%"></div></div>`;
  } else if (s.partial) {
    cloud += '<table><tr><td>Status</td><td>wird geladen …</td></tr></table>';
  } else {
    cloud += '<table><tr><td>Status</td><td>nicht erreichbar</td></tr></table>';
  }
  cloud += '</div>';

  document.getElementById('cards').innerHTML =
    card('restic-Backup', s.restic, resticExtra) +
    card('Media-Sync (Musik)', s.sync, syncExtra) +
    card('Wächter', s.watchdog) +
    cloud;
}

let fastBusy = false;
let fullBusy = false;
let fullPending = false;

function setStamp(extra) {
  const el = document.getElementById('stamp');
  if (extra) el.textContent = extra;
}

async function loadFast() {
  if (fastBusy) return;
  fastBusy = true;
  try {
    render(await inv('status_fast'));
    inv('ready').catch(() => {});
  }
  catch (e) {
    setStamp('Fehler: ' + e);
    inv('ready').catch(() => {});
  }
  finally { fastBusy = false; }
}

async function loadFull(force) {
  if (fullBusy) { if (force) fullPending = true; return; }
  fullBusy = true;
  if (force) setStamp('lädt …');
  try { render(await inv(force ? 'refresh' : 'status')); }
  catch (e) { setStamp('Fehler: ' + e); }
  finally {
    fullBusy = false;
    if (fullPending) { fullPending = false; loadFull(true); }
  }
}

async function load(force) {
  await loadFast();
  await loadFull(force);
}

const start = (name, btn) => async () => {
  btn.disabled = true;
  try { await inv('action', { name }); }
  catch (e) { alert('Fehler: ' + e); }
  finally { btn.disabled = false; setTimeout(() => load(false), 1200); }
};

const bRestic = document.getElementById('b-restic');
const bSync = document.getElementById('b-sync');
const bWatch = document.getElementById('b-watch');
bRestic.onclick = start('restic', bRestic);
bSync.onclick = start('sync', bSync);
bWatch.onclick = start('watchdog', bWatch);
document.getElementById('b-reload').onclick = () => load(true);

load(false);
setInterval(() => load(false), 20000);
</script>
</body>
</html>
