<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0c10;
    --line: #1a2128;
    --line-2: #232c35;
    --text: #edf2f5;
    --muted: #a5b2bf;
    --dim: #6b7b89;
    --teal: #1a8a9e;
    --teal-light: #50bfcc;
    --green: #54e0a8;
    --red: #ef8f8f;
    --amber: #d9a441;
    --blue: #5b9bd5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #1e2831; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::selection { background: rgba(80,191,204,.25); }

  /* ---------- Top navigation ---------- */
  .topbar {
    display: flex; align-items: center; gap: 26px;
    height: 58px; padding: 0 26px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .mark {
    width: 22px; height: 22px; border-radius: 7px;
    background: linear-gradient(150deg, var(--teal-light), var(--teal));
    display: grid; place-items: center;
    color: #04171b; font-weight: 800; font-size: 12px;
  }
  .brand b { font-size: 15px; letter-spacing: -.01em; font-weight: 650; }
  nav { display: flex; gap: 2px; }
  nav button {
    all: unset; cursor: pointer;
    padding: 7px 12px; border-radius: 7px;
    color: var(--muted); font-size: 13.5px; font-weight: 500;
    white-space: nowrap;
  }
  nav button:hover { color: var(--text); background: #12171d; }
  nav button.on { color: var(--text); background: #141c23; box-shadow: inset 0 -2px 0 var(--teal); border-radius: 7px 7px 0 0; }
  .topbar .spacer { flex: 1; }
  .topbar .meta { color: var(--dim); font-size: 12px; text-align: right; line-height: 1.35; }
  .topbar .meta b { color: var(--muted); font-weight: 500; }
  .icon-btn {
    all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; color: var(--muted);
  }
  .icon-btn:hover { background: #141c23; color: var(--text); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* ---------- Buttons ---------- */
  .btn {
    all: unset; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 8px 14px; border-radius: 8px;
    background: var(--teal); color: #04171b;
    font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .btn:hover { background: var(--teal-light); }
  .btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
  .btn.ghost:hover { background: #141c23; box-shadow: inset 0 0 0 1px #2e3b46; }
  .btn.quiet { background: transparent; color: var(--muted); padding: 6px 9px; font-weight: 500; }
  .btn.quiet:hover { color: var(--text); background: #12171d; }
  .btn.danger { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1px #4a2424; }
  .btn.danger:hover { background: #20100f; }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
  .btn:disabled { opacity: .45; cursor: default; }

  /* ---------- Layout ---------- */
  main { display: flex; min-height: calc(100vh - 58px); }
  .rail {
    width: 236px; flex: 0 0 236px;
    border-right: 1px solid var(--line);
    padding: 26px 20px;
    display: flex; flex-direction: column; gap: 8px;
    position: sticky; top: 58px; height: calc(100vh - 58px); overflow: auto;
  }
  .content { flex: 1; min-width: 0; padding: 30px 34px 70px; }
  .content.narrow { max-width: 1000px; }

  .gauge { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .gauge .ring {
    width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    color: var(--teal-light);
    background: conic-gradient(var(--teal-light) var(--p, 100%), #1a2229 0);
    position: relative;
  }
  .gauge .ring::after {
    content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg);
  }
  .gauge .ring span { position: relative; z-index: 1; }
  .gauge .lbl { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .gauge .val { font-size: 13px; font-weight: 600; }

  .rail h4 {
    font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--dim); font-weight: 600; margin: 18px 0 8px;
  }
  .titem { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
  .titem:hover .tl { color: var(--text); }
  .titem .clock { font-size: 11.5px; color: var(--dim); width: 62px; flex: 0 0 62px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .titem .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: 0 0 6px; background: var(--teal-light); }
  .titem .dot.bad { background: var(--red); }
  .titem .tl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .titem .tn { font-size: 11.5px; color: var(--dim); }

  /* ---------- Hero ---------- */
  .hero { padding-bottom: 26px; border-bottom: 1px solid var(--line); }
  .hero h2 { margin: 0 0 6px; font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
  .hero p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .hero p b { color: var(--text); font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-bottom: 1px solid var(--line); }
  .stat { padding: 22px 0; }
  .stat + .stat { padding-left: 26px; border-left: 1px solid var(--line); }
  .stat .n { font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
  .stat .n.bad { color: var(--red); }
  .stat .n.ok { color: var(--green); }
  .stat .k { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 6px; }

  /* ---------- Filter tabs ---------- */
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-top: 4px; }
  .tabs button {
    all: unset; cursor: pointer; padding: 13px 0 12px;
    font-size: 13px; color: var(--dim); font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--muted); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--teal-light); }

  /* ---------- Flat rows ---------- */
  .rowlist { display: flex; flex-direction: column; }
  .row {
    display: grid; grid-template-columns: 18px 1fr auto auto;
    align-items: center; gap: 14px;
    padding: 13px 4px; border-bottom: 1px solid var(--line);
  }
  .row:hover { background: #0d1116; }
  .row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal-light); }
  .row .dot.bad { background: var(--red); }
  .row .dot.warn { background: var(--amber); }
  .row .dot.off { background: #3a4650; }
  .row .main { min-width: 0; }
  .row .title { font-size: 13.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row .when { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .tail { font-size: 12px; color: var(--muted); }
  .row .act { display: flex; gap: 4px; justify-content: flex-end; }
  .row .prog { font-size: 11.5px; color: var(--teal-light); margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* ---------- Forms ---------- */
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
  .field > label { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; background: #0c1015; color: var(--text);
    border: 1px solid var(--line-2); border-radius: 7px;
    padding: 8px 10px; font-size: 13px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--teal); }
  textarea { resize: vertical; min-height: 58px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .fgrid { display: grid; gap: 0 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin: 0 18px 10px 0; cursor: pointer; }
  .check input { accent-color: var(--teal); width: 14px; height: 14px; }
  .hint { font-size: 12px; color: var(--dim); margin: 12px 0 0; line-height: 1.6; }
  .hint code, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); }
  .section-title {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); font-weight: 600; margin: 0 0 14px;
  }
  .panel { border-top: 1px solid var(--line); padding: 26px 0 0; margin-top: 26px; }
  .panel:first-child { border-top: 0; padding-top: 0; margin-top: 0; }

  .pathrow {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--line);
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
  }
  .pathrow .p { flex: 1; word-break: break-all; }
  .pathrow button { all: unset; cursor: pointer; color: var(--dim); padding: 2px 5px; border-radius: 4px; font-size: 14px; }
  .pathrow button:hover { color: var(--red); background: #1b1113; }

  .jobhead {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 4px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .jobhead:hover { background: #0d1116; }
  .jobhead .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal-light); flex: 0 0 8px; }
  .jobhead .dot.off { background: #3a4650; }
  .jobhead .dot.bad { background: var(--red); }
  .jobhead .grow { flex: 1; min-width: 0; }
  .jobhead .name { font-size: 14.5px; font-weight: 600; }
  .jobhead .desc { font-size: 12px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jobhead .chev { color: var(--dim); transition: transform .15s; }
  .jobhead.open .chev { transform: rotate(90deg); }
  .jobbody { padding: 22px 0 26px; border-bottom: 1px solid var(--line); }

  /* ---------- Restore / history ---------- */
  .split { display: grid; grid-template-columns: 300px 1fr; gap: 0; border-top: 1px solid var(--line); }
  .split .pane { min-height: 220px; }
  .split .pane:first-child { max-height: 460px; overflow: auto; }
  .pane { padding: 20px 0; }
  .pane + .pane { border-left: 1px solid var(--line); padding-left: 26px; margin-left: 26px; }
  .pane h3 { margin: 0 0 14px; font-size: 13px; font-weight: 600; }
  .snap { padding: 9px 10px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
  .snap:hover { background: #0d1116; }
  .snap.sel { background: #101c22; border-color: #22414b; }
  .snap .t { font-size: 12.5px; font-weight: 550; }
  .snap .s { font-size: 11.5px; color: var(--dim); font-family: ui-monospace, Menlo, monospace; }

  .filelist { display: flex; flex-direction: column; }
  .fitem {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  }
  .fitem:hover { background: #0d1116; }
  .fitem.sel { background: #101c22; border-color: #22414b; }
  .fitem .ico { width: 15px; text-align: center; color: var(--teal-light); font-size: 12px; }
  .fitem .nm { flex: 1; min-width: 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fitem .sz { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .crumbs { font-size: 12px; color: var(--dim); margin-bottom: 10px; display: flex; gap: 3px; flex-wrap: wrap; }
  .crumbs span { cursor: pointer; }
  .crumbs span:hover { color: var(--teal-light); }
  .empty { color: var(--dim); font-size: 12.5px; padding: 26px 0; text-align: center; }

  .versions { border-top: 1px solid var(--line); margin-top: 4px; }
  .vitem { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .vitem .cb { width: 15px; height: 15px; accent-color: var(--teal); }
  .vitem .nm { flex: 1; min-width: 0; font-size: 12.5px; }
  .vitem .nm .p { color: var(--dim); font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
  .vitem select { width: auto; min-width: 180px; padding: 5px 8px; font-size: 12px; }

  .result { font-size: 12px; margin-top: 14px; }
  .result pre {
    background: #0a0e12; border: 1px solid var(--line); border-radius: 7px;
    padding: 10px; font-size: 11px; max-height: 170px; overflow: auto;
    white-space: pre-wrap; color: var(--muted); margin: 8px 0 0;
  }
  .oktext { color: var(--green); }
  .badtext { color: var(--red); }
  .live { color: var(--dim); font-size: 12px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 16px);
    background: #121a21; border: 1px solid #26333d; color: var(--text);
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .2s; z-index: 50;
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: #4a2424; color: var(--red); }
  .alarmbar {
    display: flex; gap: 12px; align-items: flex-start;
    border: 1px solid #4a2424; background: #150d0d; border-radius: 8px;
    padding: 14px 16px; margin-bottom: 22px; font-size: 12.5px; color: #e8b4b2;
    white-space: pre-wrap;
  }
  .alarmbar b { color: var(--red); display: block; margin-bottom: 3px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="mark">B</div><b>Backup</b></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <div class="meta" id="meta"></div>
  <button class="icon-btn" id="reload" title="Neu laden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11A8 8 0 1 0 6.3 6.3L3 9.5"/><path d="M3 4v5.5h5.5"/></svg>
  </button>
  <button class="icon-btn" data-page="settings" title="Einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <aside class="rail" id="rail"></aside>
  <section class="content" id="view"></section>
</main>
<div class="toast" id="toast"></div>

<script>
const inv = (cmd, args) => window.__TAURI__.core.invoke(cmd, args || {});
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (id) => document.getElementById(id);

let page = "overview";
let cfg = null;
let st = null;
let filter = "all";

const pages = [
  ["overview", "Übersicht"],
  ["backup", "Backup"],
  ["sync", "Sync"],
  ["restore", "Wiederherstellen"],
  ["history", "Verlauf"],
  ["settings", "Einstellungen"]
];

function toast(msg, err) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (err ? " err" : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = "toast"; }, 3400);
}

function nav() {
  $("nav").innerHTML = pages.map(([id, label]) =>
    `<button data-page="${id}" class="${page === id ? "on" : ""}">${label}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b => b.onclick = () => goto(b.dataset.page));
  document.querySelectorAll("[data-page]").forEach(b => {
    if (b.parentElement === $("nav")) return;
    b.onclick = () => goto(b.dataset.page);
  });
}
function goto(p) { page = p; nav(); render(); }

const fmtSize = (n) => {
  if (n == null) return "";
  if (typeof n === "string") return n;
  const u = ["B", "KiB", "MiB", "GiB", "TiB"]; let v = n, i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(v < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
};
const fmtDate = (iso) => {
  if (!iso) return "–";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
};
const fmtClock = (iso) => {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
};

async function loadCfg() { cfg = await inv("config_get"); }
async function loadFast() { try { st = await inv("status_fast"); } catch (e) {} }
async function loadFull(force) { try { st = await inv(force ? "refresh" : "status"); } catch (e) {} }

function statusMeta() {
  const el = $("meta");
  if (!st) { el.innerHTML = ""; return; }
  el.innerHTML = `<b>${esc(st.now || "")}</b><br>Konfiguration in Datei`;
}

/* ================= Rail (Timeline) ================= */
function rail() {
  const s = st || {};
  const total = s.jobs_total || 0;
  const ok = s.jobs_ok || 0;
  const pct = total ? Math.round(ok / total * 100) : 100;
  const protects = !s.alarm && !(s.jobs_failed > 0);

  const today = new Date().toLocaleDateString("de-DE");
  const items = (s.history || []).map(h => {
    const bad = h.status === "failed";
    const day = (h.when || "").split(" ")[0] || "";
    const clock = day === today ? (h.when.split(" ")[1] || "") : day.replace(/\.\d{4}$/, "");
    return `<div class="titem" data-jump="${bad ? "overview" : "history"}">
      <div class="clock">${esc(clock)}</div>
      <div class="dot ${bad ? "bad" : ""}"></div>
      <div><div class="tl">${bad ? "Problem" : "OK"}</div>
      <div class="tn">${esc(h.name)}</div></div>
    </div>`;
  }).join("");

  $("rail").innerHTML = `
    <div class="gauge">
      <div class="ring" style="--p:${pct}%"><span>${pct}%</span></div>
      <div><div class="lbl">geschützt</div><div class="val">${protects ? "Alles aktuell" : "prüfen"}</div></div>
    </div>
    <h4>Zeitleiste</h4>
    ${items || '<div class="tn" style="padding:6px 0">Noch keine Läufe</div>'}
  `;
  $("rail").querySelectorAll("[data-jump]").forEach(el => el.onclick = () => goto(el.dataset.jump));
}

/* ================= Übersicht ================= */
function jobRows() {
  const s = st || {};
  const rows = [];
  for (const j of (s.restic || [])) {
    const snap = j.snapshot;
    const bad = j.failed;
    rows.push({
      kind: "backup",
      dot: !j.enabled ? "off" : bad ? "bad" : j.active ? "" : "warn",
      title: j.name,
      sub: `${j.paths.length} Ordner · ${esc(j.repository)}${snap ? " · letzter Snapshot " + esc(snap.time) : ""}${snap ? " · " + esc(snap.size) : ""}`,
      when: j.active ? "läuft" : (j.last || "–"),
      prog: j.progress || "",
      run: ["restic", j.id],
      log: j.tail,
    });
  }
  for (const j of (s.sync || [])) {
    const bad = j.failed;
    rows.push({
      kind: "sync",
      dot: !j.enabled ? "off" : bad ? "bad" : j.active ? "" : "warn",
      title: j.name,
      sub: `${esc(j.source)} → ${esc(j.target)} · ${j.mode === "copy" ? "kopieren" : "abgleichen"}`,
      when: j.active ? "läuft" : (j.last || "–"),
      prog: j.progress || "",
      run: ["sync", j.id],
      log: j.tail,
    });
  }
  return rows;
}

function overviewRows() {
  const s = st || {};
  let rows = jobRows();
  if (filter === "backup") rows = rows.filter(r => r.kind === "backup");
  if (filter === "sync") rows = rows.filter(r => r.kind === "sync");
  if (filter === "issues") rows = rows.filter(r => r.dot === "bad" || r.dot === "warn");
  if (filter === "checks") {
    const checks = (st.checks || []);
    if (!checks.length) return `<div class="empty">Noch keine Prüfungen – starte sie im Backup-Bereich eines Jobs.</div>`;
    return `<div class="rowlist">${checks.map(c => `
      <div class="row">
        <div class="dot ${c.status === "failed" ? "bad" : ""}"></div>
        <div class="main"><div class="title">${esc(c.kind)} · ${esc(c.name)}</div>
        <div class="sub">${esc(c.detail || "ohne Befund")}</div></div>
        <div class="when">${esc(c.when || "–")}</div>
        <div class="act"></div>
      </div>`).join("")}</div>`;
  }
  if (!rows.length) return `<div class="empty">Keine Einträge${filter === "checks" ? " – Prüfungen startest du unter Backup" : ""}</div>`;
  return `<div class="rowlist">${rows.map(r => `
    <div class="row">
      <div class="dot ${r.dot}"></div>
      <div class="main">
        <div class="title">${esc(r.title)}</div>
        <div class="sub">${r.sub}</div>
        ${r.prog ? `<div class="prog">${esc(r.prog)}</div>` : ""}
      </div>

      <div class="act">
        <button class="btn quiet sm" data-run="${r.run[0]}" data-id="${esc(r.run[1])}">Jetzt</button>

    </div>`).join("")}</div>`;
}

        <div class="field"><label>Auswahl</label><input type="text" id="r-selected" value="${esc(rs.selected || "gesamter Snapshot")}" readonly></div>
        <div class="field"><label>Zielordner</label>
          <div style="display:flex;gap:8px">

      </div>
      <div class="result" id="r-result"></div>
    </div>
  `;
}

function renderCrumbs() {
  const el = $("r-crumbs"); if (!el) return;
  if (!rs.dir) { el.innerHTML = ""; return; }
  const parts = rs.dir.split("/").filter(Boolean);
  let acc = "", html = `<span data-crumb="">/</span>`;
  for (const p of parts) { acc += "/" + p; html += ` <span data-crumb="${esc(acc)}">${esc(p)}</span> /`; }
  el.innerHTML = html;
  el.querySelectorAll("[data-crumb]").forEach(s => s.onclick = () => { rs.dir = s.dataset.crumb; browse(); });
}

function filesHtml() {
  if (!rs.snapshot) return '<div class="empty">Noch kein Snapshot gewählt</div>';
  if (!rs.files.length) return '<div class="empty">leer</div>';
  let html = "";
  if (rs.parent) html += `<div class="fitem" data-dir="${esc(rs.parent)}"><span class="ico">↰</span><span class="nm">… übergeordnet</span></div>`;
  html += rs.files.map(n => {
    const isDir = n.type === "dir";
    return `<div class="fitem ${rs.selected === n.path ? "sel" : ""}" data-${isDir ? "dir" : "file"}="${esc(n.path)}">
      <span class="ico">${isDir ? "▸" : "·"}</span>
      <span class="nm">${esc(n.name)}</span>
      <span class="sz">${isDir ? "" : fmtSize(n.size)}</span></div>`;
  }).join("");
  return html;
}

function renderFiles() {
  const el = $("r-files"); if (!el) return;
  el.innerHTML = filesHtml();
  el.querySelectorAll("[data-dir]").forEach(x => x.onclick = () => { rs.dir = x.dataset.dir; rs.selected = ""; syncSelected(); browse(); });
  el.querySelectorAll("[data-file]").forEach(x => x.onclick = () => {
    rs.selected = x.dataset.file; syncSelected();
    el.querySelectorAll(".fitem").forEach(i => i.classList.remove("sel"));
    x.classList.add("sel");
  });
}

function syncSelected() { const el = $("r-selected"); if (el) el.value = rs.selected || "gesamter Snapshot"; }

async function browse() {
  if (!rs.snapshot) return;
  rs.parent = rs.dir ? (rs.dir.split("/").slice(0, -1).join("/") || "") : "";
  renderCrumbs();
  try {
    const nodes = await inv("snapshot_files", { jobId: rs.job, snapshot: rs.snapshot, dir: rs.dir });
    nodes.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === "dir" ? -1 : 1));
    rs.files = nodes.filter(n => n.path !== rs.dir);
    renderFiles();
  } catch (e) { toast(String(e), true); }
}

/* ================= Verlauf (Datei-Historie) ================= */
const hs = { job: "", query: "", results: [], chosen: {}, picked: {} };

function histGroups() {
  const groups = new Map();
  for (const r of hs.results) {
    if (!groups.has(r.path)) groups.set(r.path, []);
    groups.get(r.path).push(r);
  }
  return [...groups.entries()].map(([path, versions]) => {
    versions.sort((a, b) => (new Date(b.mtime) - new Date(a.mtime)));
    return { path, name: versions[0].name, type: versions[0].type, size: versions[0].size, versions };
  });
}

function pageHistory() {
  const jobs = cfg?.restic || [];
  if (!hs.job && jobs.length) hs.job = jobs[0].id;
  const groups = histGroups();
  const picked = Object.keys(hs.picked).filter(k => hs.picked[k]);

  const list = groups.map(g => {
    const opts = g.versions.map(v =>
      `<option value="${esc(v.snapshot)}" ${hs.chosen[g.path] === v.snapshot ? "selected" : ""}>${esc(fmtDate(v.mtime))} · ${esc(v.short_id)}</option>`).join("");
    return `<div class="vitem">
      <input type="checkbox" class="cb" data-pick="${esc(g.path)}" ${hs.picked[g.path] ? "checked" : ""}>
      <div class="nm">${esc(g.name)}<div class="p">${esc(g.path)}</div></div>
      <select data-chose="${esc(g.path)}">${opts}</select>
    </div>`;
  }).join("");

  return `
    <div class="hero">
      <h2>Verlauf</h2>
      <p>Dateien über alle Snapshots durchsuchen und passende Versionen zurückholen.</p>
    </div>
    <div class="fgrid" style="align-items:end;margin-top:22px">
      <div class="field"><label>Backup-Job</label>
        <select id="h-job">${jobs.map(j => `<option value="${esc(j.id)}" ${j.id === hs.job ? "selected" : ""}>${esc(j.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Datei- oder Ordnername</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="h-query" value="${esc(hs.query)}" placeholder="z. B. Rechnung* oder *.pdf">
          <button class="btn" id="h-search">Suchen</button>
        </div>
      </div>
    </div>
    <p class="hint" style="margin-top:0">Platzhalter: <code>*</code> beliebig viele Zeichen, <code>?</code> genau eines. Die Suche läuft über alle Snapshots.</p>
    <div class="section-title" style="margin-top:22px">${groups.length ? groups.length + " Treffer" : "Ergebnisse"}</div>
    ${groups.length ? `<div class="versions">${list}</div>` : '<div class="empty">Noch keine Suche</div>'}
    <div class="panel">
      <div class="section-title">Ausgewählte wiederherstellen (${picked.length})</div>
      <div class="fgrid" style="align-items:end">
        <div class="field"><label>Zielordner</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="h-target" placeholder="~/wiederhergestellt">
            <button class="btn ghost sm" id="h-pick">Wählen</button>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="h-restore">Auswahl wiederherstellen</button>
        <button class="btn ghost" id="h-open" style="display:none">Ordner öffnen</button>
      </div>
      <div class="result" id="h-result"></div>
    </div>
  `;
}

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="apply-units">Timer schreiben &amp; aktivieren</button>
        <button class="btn ghost" id="disable-legacy">Alte Units abschalten</button>
        <button class="btn danger" id="remove-units">Alle entfernen</button>
      </div>
      <div class="result" id="s-result"></div>
    </div>
  `;
}

/* ================= Rendern ================= */
function render() {
  statusMeta();
  rail();
  const v = $("view");
  if (page === "overview") v.innerHTML = pageOverview();
  else if (page === "backup") v.innerHTML = pageBackup();
  else if (page === "sync") v.innerHTML = pageSync();
  else if (page === "restore") v.innerHTML = pageRestore();
  else if (page === "history") v.innerHTML = pageHistory();
  else v.innerHTML = pageSettings();
  wire();
}

function readForm(container, base) {
  const out = JSON.parse(JSON.stringify(base || {}));
  container.querySelectorAll("[data-f]").forEach(el => {
    const f = el.dataset.f;
    if (el.type === "checkbox") out[f] = el.checked;
    else if (el.type === "number") out[f] = el.value === "" ? null : Number(el.value);
    else if (f === "exclude") out[f] = el.value.split("\n").map(x => x.trim()).filter(Boolean);
    else if (f === "tags") out[f] = el.value.split(",").map(x => x.trim()).filter(Boolean);
    else out[f] = el.value;
  });
  return out;
}

function collectRestic() {
  const list = [...cfg.restic];
  document.querySelectorAll(".jobbody").forEach(() => {});
  document.querySelectorAll("[data-f]").forEach(() => {});
  // only currently open job has inputs; merge them back
  document.querySelectorAll(".jobbody").forEach(body => {
    const head = body.previousElementSibling;
    if (!head || head.dataset.open == null) return;
    const idx = Number(head.dataset.open);
    if (Number.isNaN(idx) || !list[idx]) return;
    list[idx] = readForm(body, list[idx]);
  });
  cfg.restic = list;
}

function collectSync() {
  const list = [...cfg.sync];
  document.querySelectorAll(".jobbody").forEach(body => {
    const head = body.previousElementSibling;
    if (!head || head.dataset.openSync == null) return;
    const idx = Number(head.dataset.openSync);
    if (Number.isNaN(idx) || !list[idx]) return;
    list[idx] = readForm(body, list[idx]);
  });
  cfg.sync = list;
}

function readSettings() {
  const out = { ...cfg.settings };
  document.querySelectorAll("[data-sf]").forEach(el => {
    const f = el.dataset.sf;
    if (el.type === "checkbox") out[f] = el.checked;
    else if (el.type === "number") out[f] = Number(el.value || 0);
    else out[f] = el.value;
  });
  cfg.settings = out;
}

async function saveCfg(msg) {
  try {
    if (page === "backup") collectRestic();
    if (page === "sync") collectSync();
    if (page === "settings") readSettings();
    cfg = await inv("config_save", { cfg });
    await loadCfg();
    toast(msg || "Gespeichert");
    render();
  } catch (e) { toast(String(e), true); }
}

async function doRun(kind, id) {
  try {
    await inv("run_job", { kind, id });
    toast("gestartet");
    setTimeout(async () => { await loadFast(); render(); await loadFull(false); render(); }, 1500);
  } catch (e) { toast(String(e), true); }
}

async function doAct(name, id, idx) {
  const slot = $("act-" + idx);
  if (slot) slot.innerHTML = '<span class="live">läuft …</span>';
  try {
    const r = await inv(name, { jobId: id, readData: name === "check_repo" && false });
    if (slot) slot.innerHTML = `<div class="${r.code === 0 ? "oktext" : "badtext"}">${r.code === 0 ? "Fertig" : "Code " + r.code}</div><pre>${esc(r.log)}</pre>`;
  } catch (e) {
    if (slot) slot.innerHTML = `<div class="badtext">${esc(String(e))}</div>`;
  }
}

/* ================= Drahten ================= */
function wire() {
  document.querySelectorAll("[data-run]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    doRun(b.dataset.run, b.dataset.id);
  });

  const save = $("save"); if (save) save.onclick = () => saveCfg();
  const nr = $("new-restic"); if (nr) nr.onclick = () => {
    if (page === "backup") collectRestic();
    cfg.restic.push({ id: "job" + (cfg.restic.length + 1), name: "Neuer Job", enabled: true,
      repository: "rclone:pcloud:backups/restic", password_file: "", cache_dir: "", paths: [],
      exclude_file: "", exclude: [], keep_daily: 7, keep_weekly: 4, keep_monthly: 12, keep_yearly: 2,
      schedule: "12h", startup: "3min", timeout: "12h", tags: ["scheduled"], host: "",
      one_file_system: true, exclude_caches: true, unit: "", timer: "" });
    openBackup = cfg.restic.length - 1; render();
  };
  const ns = $("new-sync"); if (ns) ns.onclick = () => {
    if (page === "sync") collectSync();
    cfg.sync.push({ id: "sync" + (cfg.sync.length + 1), name: "Neuer Sync", enabled: true,
      source: "", target: "pcloud:", mode: "sync", schedule: "6h", startup: "2min", timeout: "24h",
      backup_dir: ".deleted/{timestamp}", exclude: [".deleted/**"], extra_flags: [], transfers: 4,
      checkers: 8, unit: "", timer: "" });
    openSync = cfg.sync.length - 1; render();
  };

  document.querySelectorAll("[data-open]").forEach(h => h.onclick = () => {
    const idx = Number(h.dataset.open);
    collectRestic();
    openBackup = openBackup === idx ? null : idx;
    render();
  });
  document.querySelectorAll("[data-open-sync]").forEach(h => h.onclick = () => {
    const idx = Number(h.dataset.openSync);
    collectSync();
    openSync = openSync === idx ? null : idx;
    render();
  });

  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    collectRestic(); cfg.restic.splice(Number(b.dataset.del), 1); openBackup = null; render();
  });
  document.querySelectorAll("[data-del-sync]").forEach(b => b.onclick = () => {
    collectSync(); cfg.sync.splice(Number(b.dataset.delSync), 1); openSync = null; render();
  });

  document.querySelectorAll("[data-add-path]").forEach(b => b.onclick = async () => {
    const idx = Number(b.dataset.addPath);
    const dir = await inv("pick_folder");
    if (!dir) return;
    collectRestic();
    const job = cfg.restic[idx];
    if (!job.paths.includes(dir)) job.paths.push(dir);
    try {
      cfg = await inv("add_paths", { jobId: job.id, paths: [dir] });
      await loadCfg(); openBackup = idx; toast("Ordner hinzugefügt"); render();
    } catch (e) { toast(String(e), true); }
  });

  document.querySelectorAll("[data-rm-path]").forEach(b => b.onclick = async () => {
    const idx = Number(b.dataset.rmPath);
    collectRestic();
    const job = cfg.restic[idx];
    job.paths = job.paths.filter(p => p !== b.dataset.path);
    try {
      cfg = await inv("config_save", { cfg });
      await loadCfg(); openBackup = idx; toast("Ordner entfernt"); render();
    } catch (e) { toast(String(e), true); }
  });

  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const map = { check: "check_repo", prune: "prune_repo", init: "init_repo" };
    const body = b.closest(".jobbody");
    const head = body?.previousElementSibling;
    const idx = head ? Number(head.dataset.open) : 0;
    doAct(map[b.dataset.act], b.dataset.id, idx);
  });

  document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });

  /* ----- Restore ----- */
  if ($("r-load")) {
    $("r-job").onchange = (e) => { Object.assign(rs, { job: e.target.value, snapshot: "", dir: "", selected: "", snaps: [], files: [], parent: "" }); render(); };
    $("r-load").onclick = async () => {
      const btn = $("r-load"); btn.disabled = true;
      try {
        const snaps = await inv("snapshots", { jobId: rs.job, limit: null });
        rs.snaps = snaps.map(s => ({ id: s.id, short_id: s.short_id, time: s.time }));
        toast(`${snaps.length} Snapshots geladen`);
        render();
      } catch (e) { toast(String(e), true); btn.disabled = false; }
    };
    document.querySelectorAll("[data-snap]").forEach(el => el.onclick = () => {
      rs.snapshot = el.dataset.snap;
      const job = cfg.restic.find(j => j.id === rs.job);
      rs.dir = job && job.paths[0] ? job.paths[0] : "";
      rs.files = []; rs.selected = "";
      render(); browse();
    });
    $("r-pick").onclick = async () => { const d = await inv("pick_folder"); if (d) $("r-target").value = d; };
    $("r-clear").onclick = () => { rs.selected = ""; syncSelected(); renderFiles(); };
    $("r-do").onclick = async () => {
      const target = $("r-target").value.trim();
      if (!target) return toast("Bitte Zielordner wählen", true);
      if (!rs.snapshot) return toast("Bitte Snapshot wählen", true);
      const btn = $("r-do"); btn.disabled = true;
      $("r-result").innerHTML = '<span class="live">läuft …</span>';
      try {
        const r = await inv("restore", { jobId: rs.job, snapshot: rs.snapshot, target, include: rs.selected || null, dryRun: $("r-dry").checked });
        const ok = r.code === 0;
        $("r-result").innerHTML = `<div class="${ok ? "oktext" : "badtext"}">${ok ? "Fertig" : "Code " + r.code} → <span class="mono">${esc(r.target)}</span></div><pre>${esc(r.log)}</pre>`;
        const o = $("r-open"); o.style.display = "inline-flex";
        o.onclick = () => inv("open_path", { path: r.target }).catch(e => toast(String(e), true));
      } catch (e) { $("r-result").innerHTML = `<div class="badtext">${esc(String(e))}</div>`; }
      finally { btn.disabled = false; }
    };
  }

  /* ----- Verlauf ----- */
  if ($("h-search")) {
    $("h-job").onchange = (e) => { hs.job = e.target.value; hs.results = []; hs.picked = {}; render(); };
    const search = async () => {
      hs.query = $("h-query").value.trim();
      if (!hs.query) return toast("Bitte Suchbegriff eingeben", true);
      const btn = $("h-search"); btn.disabled = true;
      try {
        hs.results = await inv("history", { jobId: hs.job, pattern: hs.query });
        hs.picked = {}; hs.chosen = {};
        const groups = histGroups();
        for (const g of groups) hs.chosen[g.path] = g.versions[0].snapshot;
        toast(`${groups.length} Datei${groups.length === 1 ? "" : "en"} gefunden`);
        render();
      } catch (e) { toast(String(e), true); }
      finally { const b = $("h-search"); if (b) b.disabled = false; }
    };
    $("h-search").onclick = search;
    $("h-query").onkeydown = (e) => { if (e.key === "Enter") search(); };
    document.querySelectorAll("[data-pick]").forEach(cb => cb.onchange = () => {
      hs.picked[cb.dataset.pick] = cb.checked;
      const count = Object.values(hs.picked).filter(Boolean).length;
      const title = document.querySelector(".panel .section-title");
      if (title) title.textContent = `Ausgewählte wiederherstellen (${count})`;
    });
    document.querySelectorAll("[data-chose]").forEach(sel => sel.onchange = () => {
      hs.chosen[sel.dataset.chose] = sel.value;
    });
    $("h-pick").onclick = async () => { const d = await inv("pick_folder"); if (d) $("h-target").value = d; };
    $("h-restore").onclick = async () => {
      const target = $("h-target").value.trim();
      if (!target) return toast("Bitte Zielordner wählen", true);
      const items = histGroups().filter(g => hs.picked[g.path]);
      if (!items.length) return toast("Bitte Dateien auswählen", true);
      const btn = $("h-restore"); btn.disabled = true;
      $("h-result").innerHTML = '<span class="live">läuft …</span>';
      let okCount = 0, lastLog = "";
      try {
        for (const g of items) {
          const snap = hs.chosen[g.path] || g.versions[0].snapshot;
          const r = await inv("restore", { jobId: hs.job, snapshot: snap, target, include: g.path, dryRun: false });
          if (r.code === 0) okCount++;
          lastLog = r.log || lastLog;
        }
        $("h-result").innerHTML = `<div class="${okCount === items.length ? "oktext" : "badtext"}">${okCount} von ${items.length} wiederhergestellt → <span class="mono">${esc(target)}</span></div><pre>${esc(lastLog)}</pre>`;
        const o = $("h-open"); o.style.display = "inline-flex";
        o.onclick = () => inv("open_path", { path: target }).catch(e => toast(String(e), true));
      } catch (e) { $("h-result").innerHTML = `<div class="badtext">${esc(String(e))}</div>`; }
      finally { btn.disabled = false; }
    };
  }

  /* ----- Einstellungen ----- */
  if ($("apply-units")) {
    $("open-cfg").onclick = () => inv("open_path", { path: st ? st.config_path : "" }).catch(e => toast(String(e), true));
    $("copy-cfg").onclick = () => navigator.clipboard.writeText(st ? st.config_path : "").then(() => toast("Pfad kopiert")).catch(() => {});
    $("apply-units").onclick = async () => {
      const r = $("s-result"); r.innerHTML = '<span class="live">schreibe Units …</span>';
      try {
        readSettings();
        await inv("config_save", { cfg });
        await loadCfg();
        const list = await inv("apply_units");
        r.innerHTML = `<div class="oktext">${list.length} Dateien geschrieben, Timer aktiviert.</div><pre>${esc(list.join("\n"))}</pre>`;
      } catch (e) { r.innerHTML = `<div class="badtext">${esc(String(e))}</div>`; }
    };
    $("disable-legacy").onclick = async () => {
      try { const l = await inv("disable_legacy_units"); toast("Abgeschaltet: " + l.join(", ")); }
      catch (e) { toast(String(e), true); }
    };
    $("remove-units").onclick = async () => {
      if (!confirm("Alle backup-status-Units entfernen? Die Konfiguration bleibt erhalten.")) return;
      try { await inv("remove_units"); toast("Units entfernt"); } catch (e) { toast(String(e), true); }
    };
  }

  const reload = $("reload");
  if (reload) reload.onclick = async () => { reload.disabled = true; await loadFull(true); render(); };
  if ($("r-selected")) {
    syncSelected();
    renderCrumbs();
    renderFiles();
  }
}

/* ================= Start ================= */
async function boot() {
  nav();
  try { cfg = await inv("config_get"); } catch (e) { cfg = { settings: {}, restic: [], sync: [] }; }
  await loadFast();
  render();
  inv("ready").catch(() => {});
  loadFull(false).then(render);
  setInterval(async () => { await loadFast(); render(); }, 20000);
}
boot();
</script>
</body>
</html>
