[package]
name = "backup-status"
version = "0.2.0"
edition = "2021"
description = "Backup- und Sync-Verwaltung für restic und rclone – Konfiguration in Dateien, Oberfläche optional"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
